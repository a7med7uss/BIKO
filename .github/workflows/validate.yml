name: Validate BIKO
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check Google Drive config endpoint syntax
        run: node --check api/google-drive-config.js
      - name: Validate Vercel configuration
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json', 'utf8'))"
