<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="BIKO — نفس اللقطة، نفس اللحظة — مهما كانت المسافة.">
  <title>BIKO — Watch together</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="home" class="home-page">
    <div class="home-glow home-glow-a"></div>
    <div class="home-glow home-glow-b"></div>
    <div class="home-content">
      <a class="brand brand-home" href="/" aria-label="BIKO home">BIKO</a>
      <p class="tagline">نفس اللقطة، نفس اللحظة — مهما كانت المسافة.</p>

      <form id="create-form" class="url-form">
        <label class="sr-only" for="drive-url">رابط فيديو Google Drive</label>
        <input id="drive-url" type="url" inputmode="url" autocomplete="url"
          placeholder="رابط فيديو Google Drive" required>
        <button id="create-btn" class="create-button" type="submit" aria-label="إنشاء غرفة مشاهدة" title="إنشاء غرفة">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </form>
      <div class="drive-connect-row">
        <button id="drive-action" class="drive-connect-button" type="button">ربط Google Drive</button>
        <span id="drive-account-status" class="drive-account-status"></span>
      </div>
      <p id="home-error" class="form-error" role="alert"></p>
    </div>
    <footer class="home-footer">احمد حسين عمارة · <a href="/privacy.html">سياسة الخصوصية</a></footer>
  </main>

  <main id="room-page" class="room-page" hidden>
    <header class="room-header">
      <a class="brand brand-small" href="/" aria-label="BIKO home">BIKO</a>
      <div class="room-header-right">
        <span id="role-pill" class="role-pill">مشاهد</span>
        <span class="connection-pill"><i id="connection-dot" class="connection-dot"></i><span id="connection-label">جارٍ الاتصال</span></span>
        <span class="members-pill"><span id="member-count">1</span> أعضاء</span>
        <button id="copy-invite" class="secondary-button" type="button">نسخ الدعوة</button>
        <a class="home-link" href="/">الرئيسية</a>
      </div>
    </header>

    <section class="watch-area">
      <div class="player-heading">
        <div>
          <h1 id="room-title">غرفة مشاهدة</h1>
          <p id="room-subtitle">يتم تجهيز فيديو Google Drive...</p>
        </div>
        <button id="fullscreen-button" class="icon-button" type="button" aria-label="ملء الشاشة" title="ملء الشاشة">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg>
        </button>
      </div>

      <div id="player-stage" class="player-stage">
        <video id="drive-video" playsinline preload="metadata" crossorigin="anonymous"></video>
        <button id="drive-start" class="drive-start" type="button">اضغط لبدء المشاهدة</button>
        <div id="player-error" class="player-error" hidden></div>
      </div>

      <div id="local-media-controls" class="local-media-controls">
        <label for="local-volume">مستوى الصوت</label>
        <input id="local-volume" type="range" min="0" max="1" step="0.05" value="1">
        <button id="local-mute" class="secondary-button" type="button">كتم الصوت</button>
      </div>

      <div class="sync-bar">
        <div class="host-controls" id="host-controls" hidden>
          <button class="control-button" type="button" data-action="seek-back" aria-label="رجوع 10 ثوان">−10</button>
          <button class="control-button control-play" type="button" data-action="toggle">تشغيل / إيقاف</button>
          <button class="control-button" type="button" data-action="seek-forward" aria-label="تقديم 10 ثوان">+10</button>
        </div>
        <p id="sync-hint" class="sync-hint">المضيف يتحكم في المشاهدة.</p>
        <span id="playback-status" class="playback-status">في انتظار الفيديو</span>
      </div>
    </section>
    <div id="room-toast" class="toast" role="status" aria-live="polite"></div>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
