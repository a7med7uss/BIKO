<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="BIKO — نفس اللقطة، نفس اللحظة — مهما كانت المسافة.">
  <title>BIKO — Watch together</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="home" class="home-page">
    <div class="home-glow home-glow-a"></div>
    <div class="home-glow home-glow-b"></div>
    <div class="home-content">
      <a class="brand brand-home" href="/" aria-label="BIKO home">BIKO</a>
      <p class="tagline">نفس اللقطة، نفس اللحظة — مهما كانت المسافة.</p>

      <form id="create-form" class="url-form">
        <label class="sr-only" for="drive-url">رابط فيديو Google Drive</label>
        <input id="drive-url" type="url" inputmode="url" autocomplete="url"
          placeholder="رابط فيديو Google Drive" required>
        <button id="create-btn" class="create-button" type="submit" aria-label="إنشاء غرفة مشاهدة" title="إنشاء غرفة">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </form>
      <div class="drive-connect-row">
        <button id="drive-action" class="drive-connect-button" type="button">ربط Google Drive</button>
        <span id="drive-account-status" class="drive-account-status"></span>
      </div>
      <p id="home-error" class="form-error" role="alert"></p>
    </div>
    <footer class="home-footer">احمد حسين عمارة · <a href="/privacy.html">سياسة الخصوصية</a></footer>
  </main>

  <main id="room-page" class="room-page" hidden>
    <header class="room-header">
      <a class="brand brand-small" href="/" aria-label="BIKO home">BIKO</a>
      <div class="room-header-right">
        <div class="room-status-group" aria-label="حالة الغرفة">
          <span id="role-pill" class="role-pill">مشاهد</span>
          <span class="connection-pill"><i id="connection-dot" class="connection-dot"></i><span id="connection-label">جارٍ الاتصال</span></span>
          <span class="members-pill">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM20 8v6M23 11h-6"/></svg>
            <span id="member-count">1</span><span class="members-label">أعضاء</span>
          </span>
        </div>
        <button id="copy-invite" class="secondary-button copy-invite-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
          <span>نسخ الدعوة</span>
        </button>
      </div>
    </header>

    <section class="watch-area">
      <div class="player-heading">
        <div class="room-title-wrap">
          <h1 id="room-title">غرفة مشاهدة</h1>
        </div>

      </div>

      <div id="player-stage" class="player-stage">
        <video id="drive-video" playsinline preload="metadata" crossorigin="anonymous"></video>

        <button id="drive-start" class="drive-start" type="button" hidden>اضغط لبدء المشاهدة</button>

        <div id="video-controls" class="video-controls">
          <div class="video-center-controls">
            <button class="player-icon-button skip-button" type="button" data-action="seek-back" aria-label="رجوع 10 ثوان" title="رجوع 10 ثوان">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 6 9 12l10 6z"/></svg>
            </button>
            <button id="player-play-button" class="player-icon-button player-main-button" type="button" data-action="toggle" aria-label="تشغيل" title="تشغيل">
              <svg class="play-shape" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8c0-1 1.1-1.6 2-1l11 6.7a1.8 1.8 0 0 1 0 3L9 20.2c-.9.6-2 .0-2-1V4.8Z"/></svg>
              <svg class="pause-shape" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z"/></svg>
            </button>
            <button class="player-icon-button skip-button" type="button" data-action="seek-forward" aria-label="تقديم 10 ثوان" title="تقديم 10 ثوان">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 6l10 6-10 6z"/></svg>
            </button>
          </div>

          <div class="video-bottom-controls">
            <div class="video-toolbar">
              <button id="player-bottom-play" class="toolbar-icon-button bottom-play-button" type="button" data-action="toggle" aria-label="تشغيل" title="تشغيل">
                <svg class="play-shape" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.8c0-1 1.1-1.6 2-1l11 6.7a1.8 1.8 0 0 1 0 3L9 20.2c-.9.6-2 .0-2-1V4.8Z"/></svg>
                <svg class="pause-shape" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z"/></svg>
              </button>

              <input id="video-seek" class="video-seek" type="range" min="0" max="1000" step="1" value="0" aria-label="موضع الفيديو">

              <button id="video-time-display" class="video-time-display" type="button" aria-label="تبديل الوقت الحالي والمتبقي" title="اضغط لعرض الوقت المتبقي">
                <span id="video-current-time">0:00</span><span class="time-divider">/</span><span id="video-duration">0:00</span>
              </button>

              <div class="video-volume-group">
                <button id="player-mute-button" class="toolbar-icon-button" type="button" aria-label="إظهار مستوى الصوت" title="مستوى الصوت" aria-expanded="false" aria-controls="volume-popover">
                  <svg class="volume-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9a5 5 0 0 1 0 6M18.5 6.5a8.5 8.5 0 0 1 0 11"/></svg>
                  <svg class="volume-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="m17 9 5 6m0-6-5 6"/></svg>
                </button>
                <div id="volume-popover" class="volume-popover" hidden>
                  <span id="volume-value" class="volume-value">100%</span>
                  <input id="player-volume" class="player-volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="مستوى الصوت" orient="vertical">
                  <span class="volume-min-max"><span>100</span><span>0</span></span>
                </div>
              </div>

              <button id="fullscreen-button" class="toolbar-icon-button fullscreen-control" type="button" aria-label="ملء الشاشة" title="ملء الشاشة">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg>
              </button>
            </div>
          </div>
        </div>

        <div id="player-error" class="player-error" hidden></div>
      </div>
    </section>
    <div id="room-toast" class="toast" role="status" aria-live="polite"></div>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
